name: Build custom Immich package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "web/**"
      - "openapi/**"
      - "i18n/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "server/Dockerfile"
      - ".github/workflows/build-custom-package.yml"
  workflow_run:
    workflows: ["Sync Immich upstream"]
    types: [completed]

concurrency:
  group: custom-immich-package
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out current fork
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/immich-server
          tags: |
            type=raw,value=custom
            type=raw,value=latest
            type=sha,prefix=custom-

      - name: Build and publish custom Immich server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            DEVICE=cpu
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deployment image
        run: |
          echo "## Custom Immich image" >> "$GITHUB_STEP_SUMMARY"
          echo "Use \`ghcr.io/${{ github.repository_owner }}/immich-server:custom\` on TrueNAS." >> "$GITHUB_STEP_SUMMARY"
          echo "The official Immich machine-learning image can stay unchanged." >> "$GITHUB_STEP_SUMMARY"
